<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog do Adilson</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#0b1f3f',
                            900: '#000080',
                            DEFAULT: '#000080',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .navy-text {
            color: #000080;
        }
        .navy-bg {
            background-color: #000080;
        }
    </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen">

    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 navy-bg rounded-2xl flex items-center justify-center text-white font-black text-2xl shadow-lg shadow-blue-900/20">
                    A
                </div>
                <div>
                    <!-- Nome ADILSON em destaque no azul marinho conforme solicitado -->
                    <h1 class="text-3xl sm:text-4xl font-black tracking-tight navy-text uppercase">
                        ADILSON
                    </h1>
                    <p class="text-xs text-slate-500 font-medium">Blog Pessoal & Ideas</p>
                </div>
            </div>

            <!-- Contador de Reações do Blog -->
            <div class="flex items-center gap-3 bg-slate-50 p-2 rounded-xl border border-slate-200">
                <span class="text-xs font-semibold text-slate-500 pl-2">Blog Geral:</span>
                <button onclick="reactMain('like')" class="flex items-center gap-1.5 px-3 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg text-xs font-bold transition-all active:scale-95 shadow-sm">
                    <i class="fa-solid fa-thumbs-up"></i>
                    <span id="main-likes">124</span>
                </button>
                <button onclick="reactMain('dislike')" class="flex items-center gap-1.5 px-3 py-1.5 bg-rose-500 hover:bg-rose-600 text-white rounded-lg text-xs font-bold transition-all active:scale-95 shadow-sm">
                    <i class="fa-solid fa-thumbs-down"></i>
                    <span id="main-dislikes">12</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Coluna dos Posts -->
        <section class="lg:col-span-2 space-y-6" id="posts-container">
            <!-- Posts inseridos dinamicamente pelo JavaScript -->
        </section>

        <!-- Lateral: Criar Novo Post & Perfil -->
        <aside class="space-y-6">
            <!-- Form de Criação de Post -->
            <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                <h2 class="text-xl font-bold navy-text mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square"></i> Novo Post no Blog
                </h2>
                <form id="new-post-form" onsubmit="createPost(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Título</label>
                        <input type="text" id="post-title" required placeholder="Digite o título do artigo..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-900 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Categoria</label>
                        <select id="post-category" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-900 text-sm">
                            <option value="Tecnologia">Tecnologia</option>
                            <option value="Reflexões">Reflexões</option>
                            <option value="Novidades">Novidades</option>
                            <option value="Projetos">Projetos</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Conteúdo</label>
                        <textarea id="post-content" required rows="4" placeholder="Escreva sua publicação aqui..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-900 text-sm resize-none"></textarea>
                    </div>
                    <button type="submit" class="w-full navy-bg hover:bg-blue-900 text-white font-bold py-2.5 rounded-lg text-sm transition-all shadow-md active:scale-98">
                        Publicar no Blog do Adilson
                    </button>
                </form>
            </div>

            <!-- Card sobre o Autor -->
            <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm text-center">
                <div class="w-20 h-20 navy-bg rounded-full mx-auto flex items-center justify-center text-white text-3xl font-black mb-3 border-4 border-slate-100 shadow">
                    AD
                </div>
                <h3 class="text-lg font-bold navy-text">ADILSON</h3>
                <p class="text-xs text-slate-500 mb-4">Criador & Autor Principal</p>
                <p class="text-sm text-slate-600 leading-relaxed">
                    Bem-vindo ao meu espaço oficial na web! Aqui compartilho conteúdos, ideias e projetos. Deixe sua curtida nos posts!
                </p>
            </div>
        </aside>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-6 border-t border-slate-800 mt-12">
        <div class="max-w-5xl mx-auto px-4 text-center text-xs">
            <p>© 2026 Blog de <strong class="text-white">ADILSON</strong>. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        // Dados de Posts Iniciais
        let posts = [
            {
                id: 1,
                title: "Bem-vindo ao meu novo Blog Oficial!",
                category: "Novidades",
                date: "Hoje às 14:30",
                content: "Olá a todos! Este é o meu novo site pessoal onde vou postar todas as minhas novidades, ideias e conteúdos interessantes. Sinta-se à vontade para deixar sua curtida ou descurtida nos artigos abaixo!",
                likes: 38,
                dislikes: 2
            },
            {
                id: 2,
                title: "Como a tecnologia está transformando nossas vidas",
                category: "Tecnologia",
                date: "Ontem às 18:10",
                content: "A cada dia que passa, novas soluções e inteligências artificiais transformam o modo como trabalhamos e interagimos. Estar atualizado é fundamental para acompanhar essas mudanças constantes.",
                likes: 25,
                dislikes: 1
            }
        ];

        let mainLikes = 124;
        let mainDislikes = 12;

        // Renderiza os posts na tela
        function renderPosts() {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';

            posts.forEach(post => {
                const postElement = document.createElement('article');
                postElement.className = 'bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4 hover:border-slate-300 transition-all';
                postElement.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="px-3 py-1 bg-blue-50 navy-text font-bold text-xs rounded-full">
                            ${post.category}
                        </span>
                        <span class="text-xs text-slate-400 font-medium">${post.date}</span>
                    </div>

                    <h2 class="text-2xl font-extrabold text-slate-900 hover:text-blue-900 cursor-pointer">
                        ${post.title}
                    </h2>

                    <p class="text-slate-600 text-sm sm:text-base leading-relaxed">
                        ${post.content}
                    </p>

                    <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-medium text-slate-500">Por <strong class="navy-text">ADILSON</strong></span>
                        </div>

                        <!-- Botões de Curtir / Descurtir do Post -->
                        <div class="flex items-center gap-2">
                            <button onclick="reactPost(${post.id}, 'like')" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-emerald-100 hover:text-emerald-700 text-slate-700 rounded-lg text-xs font-bold transition-all active:scale-95">
                                <i class="fa-solid fa-thumbs-up text-emerald-600"></i>
                                <span>${post.likes}</span>
                            </button>
                            <button onclick="reactPost(${post.id}, 'dislike')" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-rose-100 hover:text-rose-700 text-slate-700 rounded-lg text-xs font-bold transition-all active:scale-95">
                                <i class="fa-solid fa-thumbs-down text-rose-600"></i>
                                <span>${post.dislikes}</span>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(postElement);
            });
        }

        // Reações do Post Específico
        function reactPost(id, type) {
            const post = posts.find(p => p.id === id);
            if (post) {
                if (type === 'like') {
                    post.likes++;
                } else if (type === 'dislike') {
                    post.dislikes++;
                }
                renderPosts();
            }
        }

        // Reações do Blog Geral no Header
        function reactMain(type) {
            if (type === 'like') {
                mainLikes++;
                document.getElementById('main-likes').textContent = mainLikes;
            } else if (type === 'dislike') {
                mainDislikes++;
                document.getElementById('main-dislikes').textContent = mainDislikes;
            }
        }

        // Criar Novo Post
        function createPost(event) {
            event.preventDefault();
            const titleInput = document.getElementById('post-title');
            const categoryInput = document.getElementById('post-category');
            const contentInput = document.getElementById('post-content');

            const newPost = {
                id: Date.now(),
                title: titleInput.value,
                category: categoryInput.value,
                date: "Agora mesmo",
                content: contentInput.value,
                likes: 0,
                dislikes: 0
            };

            posts.unshift(newPost); // Adiciona no início da lista
            renderPosts();

            // Reseta o formulário
            titleInput.value = '';
            contentInput.value = '';
        }

        // Inicializar aplicação
        window.onload = function() {
            renderPosts();
        };
    </script>
</body>
</html>
