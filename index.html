<<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        /* Nome em cor azul-marinho */
        h1.meu-nome {
            color: navy; /* Azul Marinho */
            font-size: 3rem;
            margin-bottom: 20px;
        }

        /* Container dos botões */
        .reaction-container {
            display: flex;
            gap: 15px;
        }

        /* Estilo dos botões */
        button {
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-like {
            background-color: #28a745;
            color: white;
        }

        .btn-dislike {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Substitua "Seu Nome Aqui" pelo seu nome -->
    <h1 class="meu-nome">Seu Nome Aqui</h1>

    <div class="reaction-container">
        <button class="btn-like" onclick="curtir()">
            👍 Curtir (<span id="like-count">0</span>)
        </button>
        <button class="btn-dislike" onclick="descurtir()">
            👎 Descurtir (<span id="dislike-count">0</span>)
        </button>
    </div>

    <script>
        let likes = 0;
        let dislikes = 0;

        function curtir() {
            likes++;
            document.getElementById('like-count').textContent = likes;
        }

        function descurtir() {
            dislikes++;
            document.getElementById('dislike-count').textContent = dislikes;
        }
    </script>

</body>
</html>
